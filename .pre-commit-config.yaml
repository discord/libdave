# Install the hooks with: pipx install pre-commit && pre-commit install
# clang-format is pinned to the version CI checks with (see the format job
# in .github/workflows/main.yaml); different versions produce different
# output for the same style file.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        files: ^cpp/(afl-driver|includes|src|test)/.*\.(c|cpp|h)$
        # vendored LLVM header stays byte-identical to its upstream source
        exclude: ^cpp/afl-driver/include/
