name: Install build prerequisites

inputs:
  runner:
    description: The runner on which the action is being run
    required: true
  crypto:
    description: The crypto library being used
    required: true
  cache-dir:
    description: Where to put vcpkg cache
    required: true
  make-args:
    description: Additional arguments to pass to make to configure the build
    required: true

runs:
  using: "composite"
  steps:
    - name: Capture vcpkg revision for use in cache key
      shell: bash
      run: |
        git -C cpp/vcpkg rev-parse HEAD > cpp/vcpkg_commit.txt

    - name: Restore cache
      id: cache-vcpkg-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.cache-dir }}
        key: vcpkg-${{ inputs.runner }}-${{ inputs.crypto }}-v03-${{ hashFiles('cpp/vcpkg_commit.txt', 'cpp/vcpkg-alts/**') }}
        restore-keys: |
          vcpkg-${{ inputs.runner }}-${{ inputs.crypto }}
          v02-vcpkg-${{ inputs.runner }}-${{ inputs.crypto }}

    - name: vcpkg bootstrap (macOS/Linux)
      if: ${{ runner.os == 'macOS' || runner.os == 'Linux' }}
      shell: bash
      run: |
        ./cpp/vcpkg/bootstrap-vcpkg.sh

    - name: vcpkg bootstrap (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: cmd
      run: cpp\vcpkg\bootstrap-vcpkg.bat

    - name: Install dependencies (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        brew install go nasm
         
    - name: Set CC and CXX environment variables (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        # macOS 26 needs LLVM >= 22: the ASan runtime in earlier versions
        # deadlocks before main() there (llvm/llvm-project#200447).
        # Older images (macos-15-intel) keep llvm@18, which they ship preinstalled.
        if [[ "$(sw_vers -productVersion | cut -d. -f1)" -ge 26 ]]; then
          llvm=llvm@22
        else
          llvm=llvm@18
        fi
        prefix="$(brew --prefix $llvm)"
        if [[ ! -x "$prefix/bin/clang" ]]; then
          brew install $llvm
        fi
        if [[ ! -x "$prefix/bin/clang" ]]; then
          echo "$llvm is not available on this runner" >&2
          exit 1
        fi
        echo "Using $llvm at $prefix"
        echo "CC=$prefix/bin/clang" >> $GITHUB_ENV
        echo "CXX=$prefix/bin/clang++" >> $GITHUB_ENV

    - name: Update dependencies (act)
      if: ${{ runner.os == 'Linux' && env.ACT }}
      shell: bash
      run: |
        sudo apt-get update

    - name: Install dependencies (Ubuntu)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get install -y nasm

    - name: Set BUILD_DIR environment variable
      shell: bash
      run: |
        echo "BUILD_DIR=${{ runner.temp }}/build" >> $GITHUB_ENV

    - name: Configure build
      shell: bash
      working-directory: ./cpp
      run: make '${{ env.BUILD_DIR }}' BUILD_DIR='${{ env.BUILD_DIR }}' ${{ inputs.make-args }}

    - name: Cache vckpg
      if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.cache-vcpkg-restore.outputs.cache-primary-key }}
        path: ${{ inputs.cache-dir }}

